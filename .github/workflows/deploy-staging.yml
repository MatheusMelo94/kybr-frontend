# Deploy staging (frontend-devops-conventions.md § CI Pipeline Shape ›
# deploy-staging.yml). Staging is the Vercel Preview environment (ADR-0005):
# every pushed branch gets a preview, built on Vercel in gru1 against the
# Preview env vars (the hosted mock API while the backend is Pre-Contract).
#
# ci.yml calls this after verify, audit, container and e2e pass on the same commit, so a
# preview never exists for a red SHA. Vercel's Git integration is off
# (vercel.json), so this is the only way a preview is made.
#
# Secrets (GitHub repository secrets): VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID, VERCEL_AUTOMATION_BYPASS_SECRET. None reaches the build:
# the app's env vars live in Vercel (Sensitive), and nothing is pulled into
# the runner except the Preview env file the check reads and deletes.
# Actions are pinned to commit SHAs (frontend-security-conventions.md
# § Supply Chain).
#
# Trusted tooling (Security DV-01): every step that holds VERCEL_TOKEN runs
# code from `main`, checked out at the workspace root: the deploy-tools
# action, its CLI lockfile and scripts/. The pushed commit is checked out
# into _deploy/ and is only uploaded to Vercel and built there; nothing in
# it runs on this runner. A branch can't change what holds the token without
# going through a merge to main.
name: Deploy staging

on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true

permissions:
  contents: read

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    name: Vercel Preview, smoke, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out main (trusted deploy tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the commit to deploy (uploaded, never run here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _deploy
          persist-credentials: false

      - uses: ./.github/actions/deploy-tools

      # Fails on cross-wiring (Preview pointing at the production API), on
      # API_ALLOW_LOOPBACK_HTTP, or on a client IP header other than
      # x-vercel-forwarded-for. It names variables, never values.
      - name: Check the Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN || 'https://api.kybr.com.br' }}
        run: |
          env_file="$RUNNER_TEMP/preview.env"
          trap 'rm -f "$env_file"' EXIT
          vercel env pull "$env_file" --environment=preview --yes > /dev/null
          node scripts/check-deploy-env.mjs "$env_file" preview

      # Built on Vercel, so the Sensitive env vars never leave Vercel.
      - name: Deploy the preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF: ${{ github.ref_name }}
        run: |
          url=$(vercel deploy --cwd _deploy --yes --archive=tgz \
            --meta githubCommitSha="$COMMIT_SHA" \
            --meta githubCommitRef="$COMMIT_REF")
          if ! printf '%s' "$url" | grep -qE '^https://[a-z0-9.-]+\.vercel\.app$'; then
            echo "Unexpected deploy output; no preview URL found." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke the preview (health, security headers)
        env:
          EXPECT_PROTECTED: "true"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: sh scripts/check-deploy-headers.sh "$DEPLOY_URL"

      # ADR-0003: LCP <= 2.0 s on /v/*, mobile preset, median of 3, against the
      # preview in the production region. Meaningful once the Preview API
      # (hosted mock) answers for loja-exemplo.
      - name: Lighthouse CI on the preview
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          lhci autorun --config=lighthouserc.json \
            --collect.url="$DEPLOY_URL/v/loja-exemplo" \
            --collect.settings.extraHeaders="{\"x-vercel-protection-bypass\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\"}"

      # Lighthouse writes its settings, extra headers included, into the
      # reports. Redact the bypass secret before anything is uploaded.
      - name: Redact the bypass secret from the Lighthouse reports
        id: redact
        if: always()
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -d .lighthouseci ] || exit 0
          secret="$VERCEL_AUTOMATION_BYPASS_SECRET"
          [ -n "$secret" ] || exit 0
          grep -rlF -- "$secret" .lighthouseci | while IFS= read -r file; do
            SECRET="$secret" perl -pi -e 's/\Q$ENV{SECRET}\E/[redacted]/g' "$file"
          done
          if grep -rqF -- "$secret" .lighthouseci; then
            echo "The bypass secret is still in the reports; deleting them." >&2
            rm -rf .lighthouseci
            exit 1
          fi

      # Only after a successful redaction (Security DV-04): a redaction that
      # stopped part-way must never upload unredacted reports.
      - name: Upload the Lighthouse reports
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-preview
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always() && steps.deploy.outputs.url != ''
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF: ${{ github.ref_name }}
        run: |
          {
            echo "### Preview (staging)"
            echo ""
            echo "- URL: $DEPLOY_URL (Vercel Deployment Protection: log in or use the bypass)"
            echo "- Commit: \`$COMMIT_SHA\` on \`$COMMIT_REF\`"
            echo "- Region: gru1; API: Preview env (hosted mock while Pre-Contract)"
          } >> "$GITHUB_STEP_SUMMARY"
