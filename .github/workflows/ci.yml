# CI (frontend-devops-conventions.md § CI Pipeline Shape). Production posture.
# Actions are pinned to commit SHAs (frontend-security-conventions.md § Supply Chain).
#
# Runs on every push to any branch. A PR from a branch in this repo gets the
# same checks, because GitHub attaches them to the head commit.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    # Same-repo PR branches are already covered by the push run; this catches
    # PRs from forks only.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test, build, bundle guards
    # Skip the PR run for same-repo branches: the push run already covers that commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'features/**', 'lib/**', 'middleware.ts', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # A production build with placeholder values. lib/env.ts validates them at
      # build time. Nothing here is a secret: API_BFF_KEY is a sentinel that the
      # secret grep below must never find in the output. The URLs are https:
      # (no loopback allowance) so the build sees deployed-shape values.
      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: https://api.example.invalid
          API_PUBLIC_BASE_URL: https://api.example.invalid
          API_BFF_KEY: ci-bundle-canary-not-a-secret-7f3a9c2e51
          CLIENT_IP_HEADER: x-forwarded-for
          CLIENT_IP_TRUSTED_HOPS: "1"
          # Required in production builds (ADR-0008). PANEL_HOST stays unset:
          # the build checks the deployed shape, where the panel is off.
          LINK_HOST: kybr.com.br

      # ADR-0003: First Load JS <= 130 kB gzip on /v/*; 180 kB elsewhere.
      - name: Bundle guard
        run: pnpm check:bundle

      - name: Secret grep of the build output
        run: pnpm check:secrets
        env:
          BUNDLE_CANARY: ci-bundle-canary-not-a-secret-7f3a9c2e51

  audit:
    name: Dependency audit (high+)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          install: "false"

      # Reads pnpm-lock.yaml. Reviewed exceptions live in pnpm-workspace.yaml
      # (auditConfig.ignoreGhsas), each with a reason and a revisit date.
      # Blind to the vendored SheetJS (file:vendor/sheetjs, ADR-0012): no
      # registry advisory maps to it. Its watch is manual (Security C12).
      - run: pnpm audit --audit-level=high

      # The deploy workflows' CLIs (.github/deploy-tools), outside the app's
      # lockfile (Security DV-02). Critical blocks; reviewed exceptions are in
      # .github/deploy-tools/pnpm-workspace.yaml. High and below are reported
      # in the run summary without blocking: the advisories sit in the CLIs'
      # local builders, which the workflows don't run.
      - name: Audit the deploy tools (blocks on critical)
        run: pnpm --dir .github/deploy-tools audit --audit-level=critical

      - name: Report the deploy tools' advisories (non-blocking)
        if: always()
        run: |
          {
            echo "### Deploy tools audit (non-blocking below critical)"
            echo '```'
            pnpm --dir .github/deploy-tools audit --audit-level=high | tail -n 3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Docker fallback (build, health)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # frontend-devops-conventions.md § Dockerfile Baseline: the portable
      # fallback must build and pass its HEALTHCHECK. Runtime values are
      # placeholders; nothing here is a secret.
      - name: Build the image
        run: docker build --tag kybr-frontend:ci .

      - name: Run it and wait for the health check
        run: |
          docker run --detach --name app --publish 3000:3000 \
            --env API_BASE_URL=https://api.example.invalid \
            --env API_PUBLIC_BASE_URL=https://api.example.invalid \
            --env API_BFF_KEY=ci-runtime-placeholder-not-a-secret \
            --env CLIENT_IP_HEADER=x-forwarded-for \
            --env CLIENT_IP_TRUSTED_HOPS=1 \
            --env LINK_HOST=localhost:3000 \
            kybr-frontend:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs app
          if [ "$status" != "healthy" ]; then
            echo "Container is $status, not healthy. Health check log:" >&2
            docker inspect --format '{{json .State.Health}}' app >&2
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:3000/api/health
          [ "$(docker exec app id -u)" != "0" ] || { echo "Container runs as root." >&2; exit 1; }

  e2e:
    name: E2E (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Production matrix (frontend-qa-conventions.md § Browser & Device Matrix).
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: webkit-mobile
            browser: webkit
          - project: firefox-desktop
            browser: firefox
          # The panel (plan § 2.12; ADR-0008: served on 127.0.0.1 in E2E).
          - project: panel-desktop
            browser: chromium
          - project: panel-firefox
            browser: firefox
          - project: panel-768
            browser: chromium
          - project: panel-360
            browser: chromium
          - project: panel-webkit-360
            browser: webkit
          # The same build with PANEL_HOST unset (H-07): the panel stays dark.
          - project: panel-dark
            browser: chromium
    env:
      # E2E only: the Playwright webServer runs a production build against the
      # http: mock API on loopback. Never set in a deployed environment
      # (threat model F08).
      API_ALLOW_LOOPBACK_HTTP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install the browser and its OS dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install the browser's OS dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'features/**', 'lib/**', 'middleware.ts', 'next.config.ts') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # playwright.config.ts starts the MSW mock API and `pnpm build && pnpm start`.
      - name: Run Playwright
        run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ADR-0003/0007 lab budgets for the link and ADR-0010's for the panel
  # (lighthouserc.json: mobile, the link + /entrar; lighthouserc.panel.json:
  # desktop, /entrar + /cadastro; lighthouserc.fila.json and
  # lighthouserc.fila-desktop.json: the Fila signed in through the mock,
  # /fila/{id} mobile and /fila desktop, T116), blocking. Measured on a
  # production build against the local mock API, as the E2E job runs it,
  # because previews have no API until the backend exists (ADR-0005). No
  # secret is involved: the Fila's login is a mock-only account.
  lighthouse:
    name: Lighthouse CI (link pages, panel auth pages, Fila)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-lhci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'features/**', 'lib/**', 'middleware.ts', 'next.config.ts') }}
          restore-keys: next-lhci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Starts the mock API and `next start` on a fresh build, then runs the
      # pinned @lhci/cli (.github/deploy-tools) with the runner's Chrome (the
      # Fila's login drives it through the puppeteer-core @lhci/cli ships).
      - name: Run Lighthouse CI
        run: sh scripts/lighthouse-local.sh

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  # Staging = Vercel Preview (ADR-0005; frontend-devops-conventions.md § CI
  # Pipeline Shape › deploy-staging.yml). Only after every check above passes
  # on this commit, only for pushes (never fork PRs), never for Dependabot
  # (no deploy secrets), and only once the user turns it on with the
  # VERCEL_DEPLOY_ENABLED repository variable (docs/devops/vercel-setup.md).
  deploy-staging:
    name: Deploy staging
    needs: [verify, audit, container, e2e, lighthouse]
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
